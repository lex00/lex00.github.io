<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120d1f"/>
      <stop offset="100%" stop-color="#3d2b46"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a355" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8a355" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <g fill="#e9e4f2">
    <circle cx="150" cy="90" r="1.6" opacity="0.7"/>
    <circle cx="260" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="940" cy="80" r="1.6" opacity="0.7"/>
    <circle cx="1030" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="90" cy="220" r="1.2" opacity="0.4"/>
    <circle cx="1100" cy="230" r="1.4" opacity="0.5"/>
    <circle cx="400" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="800" cy="50" r="1.3" opacity="0.6"/>
  </g>

  <!-- globe, scaled up and pressed down toward the figure -->
  <g transform="translate(-337.5,-44.375) scale(1.5625)">
    <circle cx="600" cy="150" r="230" fill="url(#glow)"/>
    <circle cx="600" cy="150" r="128" fill="#20404a" stroke="#c98a4f" stroke-width="2" stroke-opacity="0.5"/>
    <g fill="#173238" opacity="0.9">
      <path d="M 520 90 Q 560 70 600 85 Q 570 110 540 110 Q 515 105 520 90 Z"/>
      <path d="M 630 130 Q 690 120 700 160 Q 670 190 630 175 Q 615 150 630 130 Z"/>
      <path d="M 520 180 Q 560 190 550 220 Q 520 225 505 200 Q 505 185 520 180 Z"/>
    </g>
    <path d="M 475 150 Q 600 190 725 150" stroke="#3a6068" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 490 100 Q 600 60 710 100" stroke="#3a6068" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 490 200 Q 600 240 710 200" stroke="#3a6068" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- ground -->
  <path d="M 0 610 L 130 585 L 260 605 L 400 575 L 560 600 L 700 578 L 860 602 L 1020 580 L 1200 600 L 1200 700 L 0 700 Z" fill="#0a0710"/>

  <!-- atlas, shrunk so the globe reads as crushing him -->
  <g transform="translate(600,605) scale(0.62) translate(-600,-605)">
    <g stroke="#0e0b12" fill="#0e0b12" stroke-linecap="round">
      <!-- back arm (drawn first, behind torso/globe) -->
      <path d="M 685 310 Q 745 250 715 175" stroke-width="58" fill="none"/>
      <!-- legs -->
      <path d="M 548 455 Q 500 520 478 605" stroke-width="66" fill="none"/>
      <path d="M 652 455 Q 702 520 726 605" stroke-width="66" fill="none"/>
      <!-- torso -->
      <path d="M 468 285 Q 455 375 528 462 L 672 462 Q 745 375 732 285 Q 665 255 600 258 Q 535 255 468 285 Z"/>
      <!-- front arm -->
      <path d="M 515 310 Q 455 250 485 175" stroke-width="58" fill="none"/>
    </g>

    <!-- shirt -->
    <path d="M 490 300 Q 484 350 522 405 Q 600 424 678 405 Q 716 350 710 300 Q 660 275 600 335 Q 540 275 490 300 Z" fill="#79715f"/>
    <path d="M 490 300 Q 540 275 600 335 Q 660 275 710 300" stroke="#5a5546" stroke-width="3" fill="none" opacity="0.6"/>
    <text x="600" y="378" font-size="42" font-weight="800" fill="#e9e2cf" text-anchor="middle" letter-spacing="2">OPS</text>

    <!-- head, drawn last so it always reads clearly -->
    <circle cx="600" cy="300" r="46" fill="#191319" stroke="#c98a4f" stroke-width="2" stroke-opacity="0.4"/>

    <!-- rim light on figure -->
    <path d="M 468 285 Q 455 375 528 462" stroke="#c98a4f" stroke-width="2" fill="none" opacity="0.35"/>
    <path d="M 732 285 Q 745 375 672 462" stroke="#c98a4f" stroke-width="2" fill="none" opacity="0.35"/>
  </g>
</svg>
