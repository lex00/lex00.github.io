<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 640 320" style="max-width:470px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="-70" y="0" width="640" height="320" fill="#ffffff"/>

  <!-- stink lines -->
  <g fill="none" stroke="#8c959f" stroke-width="2" stroke-linecap="round" opacity="0.3">
    <path d="M126,126 C110,110 142,98 126,82 C116,72 132,60 126,48"/>
    <path d="M182,120 C166,102 198,90 182,72 C172,60 188,48 182,34"/>
    <path d="M246,116 C228,96 262,82 244,62 C234,50 250,36 244,20"/>
    <path d="M310,120 C294,102 326,90 310,72 C300,60 316,48 310,34"/>
    <path d="M364,126 C348,110 380,98 364,82 C354,72 370,60 364,48"/>
  </g>

  <!-- flies, seen from above -->
  <defs>
    <g id="fly">
      <ellipse cx="-4.8" cy="0.4" rx="5.4" ry="2.1" transform="rotate(-30 -4.8 0.4)" fill="#57606a" opacity="0.4"/>
      <ellipse cx="4.8" cy="0.4" rx="5.4" ry="2.1" transform="rotate(30 4.8 0.4)" fill="#57606a" opacity="0.4"/>
      <g stroke="#57606a" stroke-width="0.75" stroke-linecap="round" opacity="0.8" fill="none">
        <path d="M-2,-2.4 L-5.6,-4.6"/><path d="M-2.2,0 L-6.2,0.6"/><path d="M-2,2.2 L-5.2,4.6"/>
        <path d="M2,-2.4 L5.6,-4.6"/><path d="M2.2,0 L6.2,0.6"/><path d="M2,2.2 L5.2,4.6"/>
      </g>
      <ellipse cx="0" cy="3.5" rx="2.3" ry="4" fill="#57606a"/>
      <ellipse cx="0" cy="-1.6" rx="2.7" ry="2.9" fill="#57606a"/>
      <ellipse cx="0" cy="-5.5" rx="2.6" ry="2.1" fill="#57606a"/>
      <circle cx="-1.5" cy="-6.1" r="1.15" fill="#ffffff" opacity="0.9"/>
      <circle cx="1.5" cy="-6.1" r="1.15" fill="#ffffff" opacity="0.9"/>
    </g>
  </defs>

  <use href="#fly" transform="translate(150 56) rotate(24) scale(0.95)" opacity="0.9"/>
  <use href="#fly" transform="translate(291 37) rotate(-38) scale(0.75)" opacity="0.8"/>
  <use href="#fly" transform="translate(398 73) rotate(118) scale(0.82)" opacity="0.75"/>
  <g fill="none" stroke="#57606a" stroke-width="1" stroke-dasharray="2 4" stroke-linecap="round" opacity="0.4">
    <path d="M132,70 C142,62 156,68 168,58"/>
    <path d="M382,86 C392,80 402,84 414,76"/>
  </g>

  <!-- labels -->
  <g font-size="12" font-weight="600" fill="#6b5f49" text-anchor="middle">
    <text x="120" y="114">state + ownership</text>
    <text x="248" y="94">authoring + delivery</text>
    <text x="366" y="112">index + authority</text>
  </g>

  <!-- bowl body -->
  <path d="M75,150 C75,230 155,262 250,262 C345,262 425,230 425,150 Z" fill="#eceef1" stroke="#8c959f" stroke-width="3"/>
  <path d="M99,196 C110,232 158,254 208,260" fill="none" stroke="#8c959f" stroke-width="2.5" opacity="0.25" stroke-linecap="round"/>

  <!-- gruel surface -->
  <ellipse cx="250" cy="150" rx="175" ry="30" fill="#4a4636" stroke="#5f5942" stroke-width="3"/>
  <ellipse cx="200" cy="143" rx="40" ry="8" fill="#565040" opacity="0.5"/>
  <ellipse cx="314" cy="161" rx="48" ry="9" fill="#3f3c2e" opacity="0.5"/>

  <!-- domes breaking the surface -->
  <path d="M108,149 a25,13 0 0 1 50,0 z" fill="#6b5f49" stroke="#877a5f" stroke-width="1.6"/>
  <ellipse cx="124" cy="142" rx="7" ry="3" fill="#8a7c60" opacity="0.55"/>

  <path d="M212,158 a36,19 0 0 1 72,0 z" fill="#6b5f49" stroke="#877a5f" stroke-width="1.6"/>
  <ellipse cx="234" cy="147" rx="10" ry="4" fill="#8a7c60" opacity="0.55"/>

  <path d="M336,147 a24,13 0 0 1 48,0 z" fill="#6b5f49" stroke="#877a5f" stroke-width="1.6"/>
  <ellipse cx="350" cy="141" rx="6.5" ry="2.8" fill="#8a7c60" opacity="0.55"/>

  <!-- unlabelled lumps -->
  <path d="M172,171 a17,8 0 0 1 34,0 z" fill="#5e5442" stroke="#877a5f" stroke-width="1.4"/>
  <path d="M292,137 a14,6 0 0 1 28,0 z" fill="#5e5442" stroke="#877a5f" stroke-width="1.4"/>
  <path d="M372,167 a15,7 0 0 1 30,0 z" fill="#5e5442" stroke="#877a5f" stroke-width="1.4"/>
  <path d="M92,164 a13,6 0 0 1 26,0 z" fill="#5e5442" stroke="#877a5f" stroke-width="1.4"/>

  <!-- foot -->
  <ellipse cx="250" cy="266" rx="58" ry="10" fill="#e4e7eb" stroke="#8c959f" stroke-width="3"/>

</svg>
