<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="386" fill="#0d1117"/>

  <defs>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#8b949e"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/>
    </marker>
  </defs>

  <text x="340" y="30" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">where the fence is drawn decides what it holds</text>

  <!-- a store's ACL guards rows, so the same call reaches the resources around it -->
  <rect x="40" y="46" width="600" height="140" rx="8" fill="#10161f" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="54" y="64" font-size="10.5" fill="#bc8cff">ownership in a store</text>

  <path d="M124,124 Q332,72 539,124" fill="none" stroke="#ff7b72" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <text x="332" y="92" font-size="9" fill="#ff7b72" text-anchor="middle">aws ec2 terminate-instances · succeeds</text>

  <rect x="64" y="124" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="124" y="148" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">operator · CI</text>

  <rect x="234" y="116" width="190" height="56" rx="6" fill="#1a1230" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="329" y="138" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">control plane</text>
  <text x="329" y="155" font-size="9" fill="#bc8cff" text-anchor="middle">ACL: who may change rows</text>

  <rect x="464" y="124" width="150" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="539" y="148" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">your resources</text>

  <line x1="186" y1="144" x2="228" y2="144" stroke="#8b949e" stroke-width="1.3" marker-end="url(#fn)"/>
  <line x1="426" y1="144" x2="460" y2="144" stroke="#8b949e" stroke-width="1.3" marker-end="url(#fn)"/>

  <!-- the condition is evaluated at the cloud API, so there is no path around it -->
  <rect x="40" y="216" width="600" height="140" rx="8" fill="#10161f" stroke="#7ee787" stroke-width="1.5"/>
  <text x="54" y="234" font-size="10.5" fill="#7ee787">ownership on the resource</text>

  <text x="452" y="266" font-size="9" fill="#ff7b72" text-anchor="middle">the same call · denied</text>

  <rect x="64" y="294" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="124" y="318" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">operator · CI</text>

  <rect x="234" y="286" width="190" height="56" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
  <text x="329" y="308" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">cloud API</text>
  <text x="329" y="325" font-size="9" fill="#7ee787" text-anchor="middle">Deny unless aws:ResourceTag matches</text>

  <path d="M124,290 Q212,252 329,281" fill="none" stroke="#ff7b72" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="303" y1="286" x2="355" y2="286" stroke="#ff7b72" stroke-width="3" stroke-linecap="round"/>

  <rect x="464" y="286" width="150" height="56" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="539" y="306" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">your resources</text>
  <rect x="476" y="314" width="126" height="18" rx="4" fill="#0d1117" stroke="#7ee787"/>
  <text x="539" y="326" font-size="9" fill="#7ee787" text-anchor="middle">tofu-estate: staging</text>

  <line x1="186" y1="314" x2="228" y2="314" stroke="#8b949e" stroke-width="1.3" marker-end="url(#fn)"/>
  <line x1="426" y1="314" x2="460" y2="314" stroke="#8b949e" stroke-width="1.3" marker-end="url(#fn)"/>

  <text x="340" y="372" font-size="11.5" fill="#c9d1d9" text-anchor="middle">the fence binds the credential rather than the binary</text>
</svg>
