<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Migration work classified per phase: substrate-independent thinking in blue versus work that exists because the state file does in orange; roughly 38 percent of engineering weeks are file work">
  <title>The work, sorted</title>
  <rect width="760" height="420" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0b0b0b">The work, sorted</text>
  <text x="20" y="50" font-size="12" fill="#52514e">engineering weeks estimated from the migration's published phase dates · blue survives any tool, orange exists because the file does</text>

  <!-- x scale: weeks, 0..20 -> 150 + w*28 ; phase rows: bar 20h + example line, pitch 66 -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="150" y1="66" x2="150" y2="330"/><line x1="290" y1="66" x2="290" y2="330"/>
    <line x1="430" y1="66" x2="430" y2="330"/><line x1="570" y1="66" x2="570" y2="330"/><line x1="710" y1="66" x2="710" y2="330"/>
  </g>
  <g font-size="10.5" fill="#898781" text-anchor="middle">
    <text x="150" y="346">0</text><text x="290" y="346">5</text><text x="430" y="346">10</text><text x="570" y="346">15</text><text x="710" y="346">20 wks</text>
  </g>

  <!-- P1 -->
  <text x="20" y="92" font-size="11.5" font-weight="600" fill="#0b0b0b">audit + dedup</text>
  <rect x="150" y="78" width="82" height="20" rx="4" fill="#2a78d6"><title>Audit analysis + dedup refactor design: ~3 weeks</title></rect>
  <rect x="236" y="78" width="26" height="20" rx="4" fill="#eb6834"><title>Per-resource state-rm/import execution: ~1 week</title></rect>
  <text x="150" y="114" font-size="10" fill="#898781">audit analysis, refactor design  ·  <tspan fill="#52514e">file: state-rm / import execution</tspan></text>
  <!-- P2 -->
  <text x="20" y="158" font-size="11.5" font-weight="600" fill="#0b0b0b">platform + runtime</text>
  <rect x="150" y="144" width="152" height="20" rx="4" fill="#2a78d6"><title>Naming standards, multi-account IAM roles, Okta SSO: ~5.5 weeks</title></rect>
  <rect x="306" y="144" width="208" height="20" rx="4" fill="#eb6834"><title>Spacelift standup + 4-phase bulk state migration: ~7.5 weeks</title></rect>
  <text x="150" y="180" font-size="10" fill="#898781">naming, IAM roles, Okta SSO  ·  <tspan fill="#52514e">file: Spacelift standup, bulk state moves</tspan></text>
  <!-- P3 -->
  <text x="20" y="224" font-size="11.5" font-weight="600" fill="#0b0b0b">decomposition</text>
  <rect x="150" y="210" width="334" height="20" rx="4" fill="#2a78d6"><title>141-boundary design, Route53 batching, OCI versioning: ~12 weeks</title></rect>
  <rect x="488" y="210" width="222" height="20" rx="4" fill="#eb6834"><title>Per-split state surgery, ECS drift workaround, OTel plan forensics: ~8 weeks</title></rect>
  <text x="150" y="246" font-size="10" fill="#898781">the 141 boundaries, Route53 batching, OCI  ·  <tspan fill="#52514e">file: split surgery, ECS workaround, plan forensics</tspan></text>
  <!-- P4 -->
  <text x="20" y="290" font-size="11.5" font-weight="600" fill="#0b0b0b">guardrails</text>
  <rect x="150" y="276" width="278" height="20" rx="4" fill="#2a78d6"><title>Rule content: module decisions, blast radius, security: ~10 weeks</title></rect>
  <rect x="432" y="276" width="54" height="20" rx="4" fill="#eb6834"><title>State-footgun rule classes: ~2 weeks</title></rect>
  <text x="150" y="312" font-size="10" fill="#898781">module decisions, scoping, security rules  ·  <tspan fill="#52514e">file: state-footgun rules</tspan></text>

  <!-- share band -->
  <text x="20" y="376" font-size="11.5" font-weight="600" fill="#0b0b0b">share of</text>
  <text x="20" y="390" font-size="11.5" font-weight="600" fill="#0b0b0b">~49 wks</text>
  <rect x="150" y="368" width="345" height="24" rx="4" fill="#2a78d6"><title>Substrate-independent thinking: ~30.5 weeks (62%)</title></rect>
  <rect x="499" y="368" width="211" height="24" rx="4" fill="#eb6834"><title>File work: ~18.5 weeks (38%) - the removable share gating the critical path</title></rect>
  <text x="322" y="384" font-size="10.5" fill="#fcfcfb" font-weight="600" text-anchor="middle">thinking ~62% · survives</text>
  <text x="604" y="384" font-size="10.5" font-weight="600" fill="#fcfcfb" text-anchor="middle">file work ~38% · removable</text>
</svg>
