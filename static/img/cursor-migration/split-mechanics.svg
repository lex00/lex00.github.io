<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="What one monolith split takes: with a state file it takes four careful steps; with identity hooks it takes two, and neither half moves. Cursor needed about 120 splits.">
  <title>What one split takes</title>
  <rect width="760" height="290" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0b0b0b">What one split takes</text>
  <text x="20" y="50" font-size="12" fill="#52514e">the monolith was split about 120 times on the way from 21 root modules to 141</text>

  <!-- left card: state file -->
  <rect x="20" y="66" width="350" height="204" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <text x="40" y="94" font-size="12.5" font-weight="600" fill="#0b0b0b">with a state file</text>
  <g font-size="11.5">
    <rect x="40" y="106" width="310" height="28" rx="6" fill="#f0efec"/>
    <text x="52" y="124" fill="#52514e">1</text><text x="70" y="124" fill="#0b0b0b">back up the state</text>
    <rect x="40" y="142" width="310" height="28" rx="6" fill="#f0efec"/>
    <text x="52" y="160" fill="#52514e">2</text><text x="70" y="160" fill="#0b0b0b">map the dependencies</text>
    <rect x="40" y="178" width="310" height="28" rx="6" fill="#f0efec"/>
    <text x="52" y="196" fill="#52514e">3</text><text x="70" y="196" fill="#0b0b0b">surgically move entries between files</text>
    <rect x="40" y="214" width="310" height="28" rx="6" fill="#f0efec"/>
    <text x="52" y="232" fill="#52514e">4</text><text x="70" y="232" fill="#0b0b0b">verify clean plans on both halves</text>
  </g>

  <!-- right card: identity hooks -->
  <rect x="390" y="66" width="350" height="204" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
  <text x="410" y="94" font-size="12.5" font-weight="600" fill="#0b0b0b">with identity hooks</text>
  <g font-size="11.5">
    <rect x="410" y="106" width="310" height="28" rx="6" fill="#2a78d6"/>
    <text x="422" y="124" fill="#cde2fb">1</text><text x="440" y="124" fill="#ffffff">rewrite the estate tag on what leaves</text>
    <rect x="410" y="142" width="310" height="28" rx="6" fill="#2a78d6"/>
    <text x="422" y="160" fill="#cde2fb">2</text><text x="440" y="160" fill="#ffffff">copy the IAM policy under the new name</text>
  </g>
  <text x="410" y="216" font-size="14" font-weight="600" fill="#0b0b0b">Neither half moves.</text>
  <text x="410" y="236" font-size="11.5" fill="#52514e">a clean plan on each half confirms it, live</text>
</svg>
