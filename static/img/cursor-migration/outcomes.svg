<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="The migration's published outcomes: plans 5x faster, 2.6x more infrastructure PRs per week, 91% smaller blast radius, 571% more root modules, and 45.8% of state removed as duplication">
  <title>The migration's published outcomes</title>
  <rect width="760" height="330" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#0b0b0b">What the seven months bought</text>
  <text x="20" y="50" font-size="12" fill="#52514e">the migration's published numbers, Oct 2025 → May 2026</text>

  <!-- tile grid: 4 tiles, 172w x 150h, gap 12, y=70 -->
  <g>
    <rect x="20" y="70" width="172" height="150" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
    <text x="36" y="102" font-size="12" fill="#52514e">prod plan time</text>
    <text x="36" y="150" font-size="40" font-weight="700" fill="#2a78d6">5×</text>
    <text x="36" y="172" font-size="12" fill="#0b0b0b" font-weight="600">faster</text>
    <text x="36" y="200" font-size="11.5" fill="#898781">10+ min → 2 min</text>
  </g>
  <g>
    <rect x="204" y="70" width="172" height="150" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
    <text x="220" y="102" font-size="12" fill="#52514e">infra PRs / week</text>
    <text x="220" y="150" font-size="40" font-weight="700" fill="#2a78d6">2.6×</text>
    <text x="220" y="172" font-size="12" fill="#0b0b0b" font-weight="600">more shipped</text>
    <text x="220" y="200" font-size="11.5" fill="#898781">194 → 500+</text>
  </g>
  <g>
    <rect x="388" y="70" width="172" height="150" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
    <text x="404" y="102" font-size="12" fill="#52514e">blast radius</text>
    <text x="404" y="150" font-size="40" font-weight="700" fill="#2a78d6">−91%</text>
    <text x="404" y="172" font-size="12" fill="#0b0b0b" font-weight="600">per run</text>
    <text x="404" y="200" font-size="11.5" fill="#898781">54 → 5 median resources</text>
  </g>
  <g>
    <rect x="572" y="70" width="168" height="150" rx="10" fill="#ffffff" stroke="rgba(11,11,11,0.10)"/>
    <text x="588" y="102" font-size="12" fill="#52514e">root modules</text>
    <text x="588" y="150" font-size="40" font-weight="700" fill="#2a78d6">+571%</text>
    <text x="588" y="172" font-size="12" fill="#0b0b0b" font-weight="600">finer scoping</text>
    <text x="588" y="200" font-size="11.5" fill="#898781">21 → 141</text>
  </g>

  <!-- footer strip: dedup + plan percentiles -->
  <g>
    <rect x="20" y="236" width="720" height="66" rx="10" fill="#f0efec"/>
    <text x="36" y="263" font-size="12" fill="#52514e">state dedup · IAM was 70% of prod state</text>
    <text x="36" y="286" font-size="14" font-weight="600" fill="#0b0b0b">8,480 → 4,593 resources <tspan fill="#52514e" font-weight="400">(−45.8% was duplication)</tspan></text>
    <text x="724" y="263" font-size="12" fill="#52514e" text-anchor="end">plan seconds, mean · P50 · P95</text>
    <text x="724" y="286" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">488 · 423 · 749 <tspan fill="#898781" font-weight="400">→</tspan> 296 · 272 · 414</text>
  </g>
</svg>
