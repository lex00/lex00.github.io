<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 525" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1100" height="525" fill="#ffffff"/>
<text x="32" y="48" font-size="27" font-weight="800" fill="#1c2128">What each answer leaves behind</text>
<text x="32" y="78" font-size="19" fill="#57606a">and what you are left operating because of it</text>
<text x="32" y="128" font-size="20.0" fill="#57606a" font-weight="700" xml:space="preserve"><tspan>Where the opinions live</tspan></text>
<text x="322" y="128" font-size="20.0" fill="#57606a" font-weight="700" xml:space="preserve"><tspan>What it invents</tspan></text>
<text x="718" y="128" font-size="20.0" fill="#57606a" font-weight="700" xml:space="preserve"><tspan>What you operate</tspan></text>
<line x1="32" y1="140" x2="1068" y2="140" stroke="#d0d7de" stroke-width="1"/>
<text x="32" y="192" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>Kro, Crossplane, Kratix</tspan></text>
<text x="322" y="192" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a CRD with a controller behind it</tspan></text>
<text x="718" y="192" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a cluster, and the abstraction</tspan></text>
<text x="718" y="222" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>inside it</tspan></text>
<line x1="32" y1="248" x2="1068" y2="248" stroke="#d0d7de" stroke-width="1"/>
<text x="32" y="288" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>Helm, Timoni, Score</tspan></text>
<text x="322" y="288" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a values format, and in Score's case</tspan></text>
<text x="322" y="318" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>state</tspan></text>
<text x="718" y="288" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a format to learn, a file to keep</tspan></text>
<text x="718" y="318" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>correct</tspan></text>
<line x1="32" y1="344" x2="1068" y2="344" stroke="#d0d7de" stroke-width="1"/>
<text x="32" y="384" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>ConfigHub</tspan></text>
<text x="322" y="384" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a store holding desired state as rows</tspan></text>
<text x="718" y="384" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>a store that has to be right</tspan></text>
<line x1="32" y1="409" x2="1068" y2="409" stroke="#d0d7de" stroke-width="1"/>
<text x="32" y="448" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>chant</tspan></text>
<text x="322" y="448" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>nothing new. A composite assembles</tspan></text>
<text x="322" y="480" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>spec-native resources</tspan></text>
<text x="718" y="448" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>the spec your platform already</tspan></text>
<text x="718" y="480" font-size="22.5" fill="#1c2128" xml:space="preserve"><tspan>defines</tspan></text>
</svg>
