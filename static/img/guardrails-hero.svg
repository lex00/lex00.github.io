<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 10 810 350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="70" y="10" width="810" height="350" fill="#0d1117"/>

  <!-- the drop: everything left and above the cliff edge -->
  <path d="M0,490 L300,490 C315,390 335,315 368,240 C404,158 462,112 525,72 C588,32 690,28 790,22 L880,20 L880,0 L0,0 Z" fill="#04070b"/>
  <path d="M300,490 C315,390 335,315 368,240 C404,158 462,112 525,72 C588,32 690,28 790,22 L880,20" fill="none" stroke="#3d4551" stroke-width="2.6"/>
  <path d="M290,490 C305,390 325,315 358,238 C394,156 452,108 515,68 C578,28 686,22 786,16 L880,14" fill="none" stroke="#262d36" stroke-width="3.4" opacity="0.7"/>
  <path d="M278,490 C293,390 313,313 346,236 C382,154 440,104 503,64 C566,24 682,16 782,10 L880,8" fill="none" stroke="#1a2029" stroke-width="4.5" opacity="0.5"/>

  <!-- terraces far below, falling away from the cliff -->
  <g fill="none" stroke="#0e141c" stroke-width="2">
    <path d="M170,470 C190,360 215,255 265,160 C297,98 320,55 335,10"/>
    <path d="M95,470 C115,365 140,265 190,175 C222,113 248,68 265,20"/>
  </g>

  <!-- cliff hachures, ticking into the void -->
  <g stroke="#3d4551" stroke-width="1.6">
    <line x1="308" y1="440" x2="290" y2="436"/>
    <line x1="318" y1="392" x2="300" y2="387"/>
    <line x1="328" y1="345" x2="310" y2="339"/>
    <line x1="342" y1="298" x2="324" y2="291"/>
    <line x1="360" y1="253" x2="342" y2="245"/>
    <line x1="382" y1="209" x2="364" y2="199"/>
    <line x1="410" y1="168" x2="393" y2="156"/>
    <line x1="444" y1="131" x2="428" y2="118"/>
    <line x1="484" y1="98" x2="470" y2="84"/>
    <line x1="530" y1="70" x2="519" y2="54"/>
    <line x1="584" y1="47" x2="576" y2="30"/>
    <line x1="646" y1="34" x2="641" y2="16"/>
    <line x1="712" y1="27" x2="709" y2="9"/>
    <line x1="782" y1="23" x2="780" y2="5"/>
  </g>

  <!-- the road, bending through the frame -->
  <path d="M424,490 C434,390 446,325 484,252 C524,176 606,136 700,118 C770,105 820,102 890,102" fill="none" stroke="#1e242c" stroke-width="92"/>
  <path d="M424,490 C434,390 446,325 484,252 C524,176 606,136 700,118 C770,105 820,102 890,102" fill="none" stroke="#8b949e" stroke-width="3" stroke-dasharray="20 16"/>

  <!-- skid marks toward the breach -->
  <g stroke="#0c1015" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M468,306 C460,272 448,242 428,212"/>
    <path d="M488,312 C480,278 468,246 448,216"/>
  </g>

  <!-- guardrail, cliff side: whole below, whole beyond, torn open at the apex -->
  <g stroke="#a89878" stroke-width="4" fill="none">
    <path d="M366,486 C376,396 386,338 410,274"/>
    <path d="M508,138 C548,110 596,90 650,77 C722,60 790,54 880,52"/>
  </g>
  <g fill="#a89878">
    <circle cx="369" cy="458" r="3.2"/>
    <circle cx="373" cy="424" r="3.2"/>
    <circle cx="378" cy="390" r="3.2"/>
    <circle cx="385" cy="356" r="3.2"/>
    <circle cx="394" cy="320" r="3.2"/>
    <circle cx="402" cy="296" r="3.2"/>
    <circle cx="410" cy="274" r="3.2"/>
    <circle cx="508" cy="138" r="3.2"/>
    <circle cx="536" cy="118" r="3.2"/>
    <circle cx="568" cy="100" r="3.2"/>
    <circle cx="604" cy="87" r="3.2"/>
    <circle cx="650" cy="77" r="3.2"/>
    <circle cx="700" cy="66" r="3.2"/>
    <circle cx="756" cy="58" r="3.2"/>
    <circle cx="820" cy="53" r="3.2"/>
  </g>

  <!-- the breach: torn pieces, one gone over the edge -->
  <g stroke="#8b949e" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M418,252 L446,220" transform="rotate(-30 432 236)"/>
    <path d="M462,196 L492,166" transform="rotate(26 477 181)"/>
  </g>
  <path d="M386,190 L412,168" stroke="#6b5f49" stroke-width="4" fill="none" stroke-linecap="round" transform="rotate(-50 399 179)"/>
  <g fill="#8b949e">
    <circle cx="424" cy="244" r="3"/>
    <circle cx="484" cy="174" r="3"/>
    <circle cx="392" cy="184" r="3"/>
  </g>

  <!-- the chant rig, tracking the curve in the inner lane -->
  <g transform="translate(667,158) rotate(-11)" fill="#000000" opacity="0.3">
    <rect x="-48" y="-11" width="64" height="22" rx="2.5"/>
    <rect x="20" y="-10" width="20" height="20" rx="3" transform="rotate(10 26 0)"/>
  </g>
  <g transform="translate(662,150) rotate(-11)">
    <rect x="-48" y="-7.5" width="64" height="22" rx="2.5" fill="#1b2129"/>
    <rect x="20" y="-6.5" width="20" height="20" rx="3" fill="#1b2129" transform="rotate(10 26 0)"/>
    <rect x="-48" y="-11" width="64" height="22" rx="2.5" fill="#2d333b" stroke="#57606a" stroke-width="1.4"/>
    <g transform="rotate(10 26 0)">
      <rect x="20" y="-10" width="20" height="20" rx="3" fill="#2d333b" stroke="#57606a" stroke-width="1.4"/>
      <line x1="34" y1="-8" x2="34" y2="8" stroke="#57606a" stroke-width="1.2"/>
    </g>
    <text x="-16" y="4" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1" fill="#7ee787">chant</text>
  </g>

  <!-- the big rig, straight on where the road wasn't, jackknifing through the rail -->
  <g transform="translate(369,143) rotate(-112)" fill="#000000" opacity="0.3">
    <rect x="-48" y="-11" width="64" height="22" rx="2.5"/>
    <rect x="20" y="-10" width="20" height="20" rx="3" transform="rotate(20 26 0)"/>
  </g>
  <g transform="translate(362,132) rotate(-112)">
    <rect x="-48" y="-7.5" width="64" height="22" rx="2.5" fill="#1b2129"/>
    <rect x="20" y="-6.5" width="20" height="20" rx="3" fill="#1b2129" transform="rotate(20 26 0)"/>
    <rect x="-48" y="-11" width="64" height="22" rx="2.5" fill="#3d4551" stroke="#8b949e" stroke-width="1.4"/>
    <g transform="rotate(20 26 0)">
      <rect x="20" y="-10" width="20" height="20" rx="3" fill="#3d4551" stroke="#8b949e" stroke-width="1.4"/>
      <line x1="34" y1="-8" x2="34" y2="8" stroke="#8b949e" stroke-width="1.2"/>
    </g>
    <text x="-16" y="3.5" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="0.4" fill="#e6edf3" transform="rotate(180 -16 0)">CLICKOPS</text>
  </g>
  <g stroke="#30363d" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M418,208 C408,196 400,186 394,176"/>
    <path d="M436,196 C426,184 418,174 412,164"/>
  </g>

  <!-- the part where it goes badly -->
  <text x="437" y="222" font-size="26" text-anchor="middle">💥</text>
  <text x="404" y="184" font-size="15" text-anchor="middle">🔥</text>
  <text x="384" y="158" font-size="12" text-anchor="middle">🔥</text>
  <text x="352" y="112" font-size="13" text-anchor="middle">🔥</text>

  <!-- the driver, electing a different outcome -->
  <g transform="translate(396,118) rotate(-35)" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-7.5" r="2.8" fill="#8b949e" stroke="none"/>
    <line x1="0" y1="-4.5" x2="0" y2="4"/>
    <path d="M0,-2 L-5.5,-6.5"/>
    <path d="M0,-2 L5.5,-7.5"/>
    <path d="M0,4 L-5.5,9.5"/>
    <path d="M0,4 L5.5,8"/>
  </g>
  <g stroke="#57606a" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M378,124 C372,120 367,115 363,109"/>
    <path d="M382,133 C376,129 371,124 367,118"/>
  </g>
</svg>
