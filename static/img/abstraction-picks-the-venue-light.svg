<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 218" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="218" fill="#ffffff"/>

  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#cf222e"/>
    </marker>
  </defs>



  <g transform="translate(0,-14)">
  <!-- top row: the venue you are left with -->
  <rect x="40" y="34" width="186" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="133" y="64" font-size="12" font-weight="700" fill="#1c2128" text-anchor="middle">in a cluster</text>

  <rect x="247" y="34" width="186" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="340" y="58" font-size="12" font-weight="700" fill="#1c2128" text-anchor="middle">wherever the store is</text>
  <text x="340" y="73" font-size="9" fill="#57606a" text-anchor="middle">which has to be right</text>

  <rect x="454" y="34" width="186" height="50" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="547" y="58" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">anywhere</text>
  <text x="547" y="73" font-size="9" fill="#57606a" text-anchor="middle">on a cluster and off one</text>

  <!-- the reach upward: two infections, one gap -->
  <line x1="133" y1="142" x2="133" y2="92" stroke="#cf222e" stroke-width="1.6" marker-end="url(#up)"/>
  <line x1="340" y1="142" x2="340" y2="92" stroke="#cf222e" stroke-width="1.6" marker-end="url(#up)"/>

  <!-- bottom row: what you invented -->
  <rect x="40" y="150" width="186" height="62" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="133" y="174" font-size="12" font-weight="700" fill="#1c2128" text-anchor="middle">a CRD and a controller</text>
  <text x="133" y="192" font-size="9" fill="#8250df" text-anchor="middle">Kro · Crossplane · Kratix</text>
  <text x="133" y="206" font-size="9" fill="#57606a" text-anchor="middle">you operate the abstraction</text>

  <rect x="247" y="150" width="186" height="62" rx="6" fill="#f5f0ff" stroke="#8250df" stroke-width="1.5"/>
  <text x="340" y="174" font-size="12" font-weight="700" fill="#1c2128" text-anchor="middle">a store</text>
  <text x="340" y="192" font-size="9" fill="#8250df" text-anchor="middle">desired state as rows</text>
  <text x="340" y="206" font-size="9" fill="#57606a" text-anchor="middle">you keep it correct</text>

  <rect x="454" y="150" width="186" height="62" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="547" y="174" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">nothing</text>
  <text x="547" y="192" font-size="9" fill="#57606a" text-anchor="middle">spec-native resources</text>
  </g>
</svg>
