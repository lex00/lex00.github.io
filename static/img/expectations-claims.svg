<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 782" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1100" height="782" fill="#0d1117"/>
<text x="32" y="48" font-size="27" font-weight="800" fill="#e6edf3">The 2026 pitch, answered line by line</text>
<text x="32" y="78" font-size="19" fill="#8b949e">Where there is no answer, the cell says so</text>
<text x="32" y="128" font-size="20.0" fill="#8b949e" font-weight="700" xml:space="preserve"><tspan>The expectation</tspan></text>
<text x="312" y="128" font-size="20.0" fill="#8b949e" font-weight="700" xml:space="preserve"><tspan>choudoufu</tspan></text>
<text x="692" y="128" font-size="20.0" fill="#8b949e" font-weight="700" xml:space="preserve"><tspan>chant</tspan></text>
<line x1="32" y1="140" x2="1068" y2="140" stroke="#30363d" stroke-width="1"/>
<text x="32" y="192" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Terraform, Ansible and</tspan></text>
<text x="32" y="222" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Helm in one governed run</tspan></text>
<text x="312" y="192" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Out of scope</tspan></text>
<text x="692" y="192" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Ops span seventeen lexicons</tspan></text>
<line x1="32" y1="248" x2="1068" y2="248" stroke="#30363d" stroke-width="1"/>
<text x="32" y="288" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Every change approved</tspan></text>
<text x="32" y="318" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>before it happens</tspan></text>
<text x="312" y="288" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Re-plans first, exits 3 on drift</tspan></text>
<text x="692" y="288" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>The gate is a fact in git</tspan></text>
<line x1="32" y1="344" x2="1068" y2="344" stroke="#30363d" stroke-width="1"/>
<text x="32" y="384" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Nothing runs off-plan</tspan></text>
<text x="312" y="384" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Holds against drift</tspan></text>
<text x="692" y="384" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Not against an edited root</tspan></text>
<line x1="32" y1="409" x2="1068" y2="409" stroke="#30363d" stroke-width="1"/>
<text x="32" y="448" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>10x scale, thousands of</tspan></text>
<text x="32" y="480" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>resources</tspan></text>
<text x="312" y="448" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>745 against real AWS, at call parity</tspan></text>
<text x="692" y="448" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Synthetic bench to 200</tspan></text>
<line x1="32" y1="505" x2="1068" y2="505" stroke="#30363d" stroke-width="1"/>
<text x="32" y="544" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Brownfield adoption</tspan></text>
<text x="312" y="544" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20.9" fill="#79c0ff">live-adopt</tspan><tspan>, behind a gate</tspan></text>
<text x="692" y="544" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20.9" fill="#79c0ff">carve</tspan><tspan>, one resource at a time</tspan></text>
<line x1="32" y1="570" x2="1068" y2="570" stroke="#30363d" stroke-width="1"/>
<text x="32" y="610" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Cost allocation you can</tspan></text>
<text x="32" y="640" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>trust</tspan></text>
<text x="312" y="610" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>The marker is written on create</tspan></text>
<text x="692" y="610" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>Nothing</tspan></text>
<line x1="32" y1="666" x2="1068" y2="666" stroke="#30363d" stroke-width="1"/>
<text x="32" y="706" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>One place to see the</tspan></text>
<text x="32" y="736" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>whole estate</tspan></text>
<text x="312" y="706" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>The source behold reads</tspan></text>
<text x="692" y="706" font-size="22.5" fill="#e6edf3" xml:space="preserve"><tspan>The graph behold renders</tspan></text>
</svg>
