<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="330" fill="#0d1117"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#57606a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#f0883e"/>
    </marker>
  </defs>

  <!-- ===================== LEFT: bolt-on stack binding ===================== -->
  <text x="172" y="30" font-size="13" font-weight="700" fill="#f0883e" text-anchor="middle">what they sell you</text>

  <!-- their orchestrator holds a copy -->
  <rect x="18" y="44" width="308" height="146" rx="8" fill="#10161f" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="32" y="62" font-size="10.5" fill="#f0883e">their orchestrator</text>

  <rect x="112" y="72" width="120" height="44" rx="6" fill="#0d1117" stroke="#f0883e"/>
  <text x="172" y="90" font-size="11" font-weight="700" fill="#f0883e" text-anchor="middle">stored copy</text>
  <text x="172" y="106" font-size="9.5" fill="#8b949e" text-anchor="middle">server addresses</text>

  <text x="172" y="140" font-size="10" fill="#8b949e" text-anchor="middle">ansible only runs when the copy changes, so:</text>
  <rect x="44" y="150" width="120" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="104" y="164" font-size="10" fill="#c9d1d9" text-anchor="middle">run every time</text>
  <rect x="180" y="150" width="120" height="20" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="240" y="164" font-size="10" fill="#c9d1d9" text-anchor="middle">fake a change</text>

  <!-- producer pushes, consumer is handed a variable -->
  <line x1="84" y1="232" x2="84" y2="192" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="76" y="216" font-size="9" fill="#f0883e" text-anchor="end">pushes output</text>
  <line x1="260" y1="190" x2="260" y2="230" stroke="#f0883e" stroke-width="1.5" marker-end="url(#ao)"/>
  <text x="252" y="216" font-size="9" fill="#f0883e" text-anchor="end">handed a variable</text>

  <!-- the two repos -->
  <rect x="24" y="232" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="84" y="249" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">terraform</text>
  <text x="84" y="263" font-size="9" fill="#8b949e" text-anchor="middle">builds the servers</text>
  <rect x="200" y="232" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="260" y="249" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">ansible</text>
  <text x="260" y="263" font-size="9" fill="#8b949e" text-anchor="middle">configures them</text>
  <line x1="144" y1="252" x2="200" y2="252" stroke="#30363d" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="172" y="246" font-size="9.5" fill="#57606a" text-anchor="middle">?</text>

  <text x="172" y="304" font-size="11.5" fill="#c9d1d9" text-anchor="middle">your repos cannot see the dependency</text>

  <!-- divider -->
  <line x1="340" y1="20" x2="340" y2="312" stroke="#21262d" stroke-width="1"/>

  <!-- ===================== RIGHT: choudoufu ===================== -->
  <text x="508" y="30" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">choudoufu</text>

  <!-- your cloud holds the resource -->
  <rect x="354" y="44" width="308" height="146" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="368" y="62" font-size="10.5" fill="#8b949e">your cloud</text>

  <rect x="368" y="72" width="280" height="60" rx="6" fill="#0d1117" stroke="#30363d"/>
  <circle cx="382" cy="90" r="3.5" fill="#7ee787"/>
  <text x="392" y="94" font-size="11" font-weight="700" fill="#c9d1d9">servers</text>
  <rect x="380" y="104" width="112" height="18" rx="4" fill="#161b22" stroke="#7ee787"/>
  <text x="436" y="116" font-size="9" fill="#7ee787" text-anchor="middle">tofu-estate: servers</text>
  <rect x="498" y="104" width="140" height="18" rx="4" fill="#161b22" stroke="#7ee787"/>
  <text x="568" y="116" font-size="9" fill="#7ee787" text-anchor="middle">tofu-address: aws_instance.main</text>

  <text x="508" y="164" font-size="10" fill="#8b949e" text-anchor="middle">no copy, nothing to fake</text>

  <!-- producer tags, consumer reads live -->
  <line x1="420" y1="232" x2="420" y2="192" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="412" y="216" font-size="9" fill="#7ee787" text-anchor="end">tags it</text>
  <line x1="596" y1="190" x2="596" y2="230" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="588" y="216" font-size="9" fill="#7ee787" text-anchor="end">reads live</text>

  <!-- the two repos -->
  <rect x="360" y="232" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="420" y="249" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">choudoufu</text>
  <text x="420" y="263" font-size="9" fill="#8b949e" text-anchor="middle">declares the servers</text>
  <rect x="536" y="232" width="120" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="596" y="249" font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">ansible</text>
  <text x="596" y="263" font-size="9" fill="#8b949e" text-anchor="middle">finds them by tag</text>
  <line x1="480" y1="252" x2="536" y2="252" stroke="#7ee787" stroke-width="1.5"/>
  <text x="508" y="246" font-size="9" fill="#7ee787" text-anchor="middle">dependsOn</text>

  <text x="508" y="304" font-size="11.5" fill="#c9d1d9" text-anchor="middle">declared in your repo, resolved by tag</text>
</svg>
