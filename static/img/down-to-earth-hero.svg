<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="320" fill="#0d1117"/>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/>
    </marker>
  </defs>

  <text x="340" y="30" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">choudoufu + chant ops</text>

