  <rect x="40" y="44" width="600" height="106" rx="8" fill="#10161f" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="54" y="62" font-size="10.5" fill="#bc8cff">chant ops</text>
  <text x="626" y="62" font-size="9.5" fill="#8b949e" text-anchor="end">order derived · wiring checked · pipeline generated</text>

  <rect x="120" y="84" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="200" y="102" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">choudoufu</text>
  <text x="200" y="117" font-size="9" fill="#8b949e" text-anchor="middle">declares the servers</text>

  <rect x="400" y="84" width="160" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="102" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">ansible</text>
  <text x="480" y="117" font-size="9" fill="#8b949e" text-anchor="middle">finds them by tag</text>

  <line x1="280" y1="106" x2="400" y2="106" stroke="#7ee787" stroke-width="1.5"/>
  <text x="340" y="100" font-size="9" fill="#7ee787" text-anchor="middle">dependsOn</text>

  <!-- the resolution: the live resource and its tags -->
  <line x1="200" y1="128" x2="200" y2="194" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="192" y="166" font-size="9" fill="#7ee787" text-anchor="end">tags it</text>
  <line x1="480" y1="196" x2="480" y2="130" stroke="#7ee787" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="488" y="166" font-size="9" fill="#7ee787">reads live</text>

  <rect x="40" y="196" width="600" height="84" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="54" y="214" font-size="10.5" fill="#8b949e">your cloud</text>

  <rect x="190" y="206" width="300" height="64" rx="6" fill="#0d1117" stroke="#30363d"/>
  <circle cx="204" cy="224" r="3.5" fill="#7ee787"/>
  <text x="214" y="228" font-size="11" font-weight="700" fill="#c9d1d9">servers</text>
  <rect x="202" y="240" width="112" height="18" rx="4" fill="#161b22" stroke="#7ee787"/>
  <text x="258" y="252" font-size="9" fill="#7ee787" text-anchor="middle">tofu-estate: servers</text>
  <rect x="320" y="240" width="156" height="18" rx="4" fill="#161b22" stroke="#7ee787"/>
  <text x="398" y="252" font-size="9" fill="#7ee787" text-anchor="middle">tofu-address: aws_instance.main</text>

  <text x="340" y="306" font-size="11.5" fill="#c9d1d9" text-anchor="middle">declared in your repo, resolved by tag</text>
