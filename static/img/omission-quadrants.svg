<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="330" fill="#0d1117"/>

  <text x="340" y="30" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">an omission is never a purge</text>

  <!-- column headers: what the live resource carries -->
  <text x="304" y="60" font-size="10.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">carries your marker</text>
  <text x="304" y="73" font-size="9" fill="#8b949e" text-anchor="middle">chant:stack · tofu-estate</text>
  <text x="536" y="60" font-size="10.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">no marker of yours</text>
  <text x="536" y="73" font-size="9" fill="#8b949e" text-anchor="middle">someone else's, or not yet adopted</text>

  <!-- row 1: declared in source -->
  <text x="180" y="122" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="end">declared</text>
  <text x="180" y="136" font-size="9" fill="#8b949e" text-anchor="end">in your source</text>

  <rect x="196" y="86" width="216" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="304" y="122" font-size="15" font-weight="700" fill="#7ee787" text-anchor="middle">converge</text>
  <text x="304" y="140" font-size="9" fill="#8b949e" text-anchor="middle">the ordinary case</text>

  <rect x="428" y="86" width="216" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="536" y="122" font-size="15" font-weight="700" fill="#d29922" text-anchor="middle">refuse</text>
  <text x="536" y="140" font-size="9" fill="#8b949e" text-anchor="middle">until you adopt it</text>

  <!-- row 2: dropped from source. only the marked cell is destructive -->
  <text x="180" y="218" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="end">not declared</text>
  <text x="180" y="232" font-size="9" fill="#8b949e" text-anchor="end">you deleted the block</text>

  <rect x="196" y="182" width="216" height="80" rx="6" fill="#1a1013" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="304" y="218" font-size="15" font-weight="700" fill="#ff7b72" text-anchor="middle">delete</text>
  <text x="304" y="236" font-size="9" fill="#8b949e" text-anchor="middle">the only destructive cell</text>

  <rect x="428" y="182" width="216" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
  <text x="536" y="218" font-size="15" font-weight="700" fill="#8b949e" text-anchor="middle">keep</text>
  <text x="536" y="236" font-size="9" fill="#8b949e" text-anchor="middle">never touched, ever</text>

  <text x="340" y="300" font-size="11.5" fill="#c9d1d9" text-anchor="middle">the blast of an omission is bounded by one cell, read off the resource</text>
</svg>
