<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,4 L0,8 Z" fill="#8b949e"/>
    </marker>
    <marker id="arloop" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,4 L0,8 Z" fill="#bc8cff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="470" fill="#0d1117"/>

  <!-- ══ DEVELOPER ══ -->
  <rect x="30" y="40" width="240" height="392" rx="10" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.8"/>
  <rect x="46" y="54" width="208" height="30" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.3"/>
  <text x="150" y="75" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="1">DEVELOPER</text>

  <rect x="46" y="104" width="208" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="137" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">TypeScript</text>
  <text x="150" y="160" font-size="12.5" fill="#8b949e" text-anchor="middle">the spec, with types on it</text>

  <rect x="46" y="196" width="208" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="229" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">your own IDE</text>
  <text x="150" y="252" font-size="12.5" fill="#8b949e" text-anchor="middle">autocomplete · inline errors</text>

  <rect x="46" y="288" width="208" height="76" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.7"/>
  <text x="150" y="321" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">checked before live</text>
  <text x="150" y="344" font-size="12.5" fill="#8b949e" text-anchor="middle">types + semantic lint</text>

  <text x="150" y="400" font-size="12.5" fill="#6e7681" text-anchor="middle" font-style="italic">git versions and reviews it</text>

  <line x1="270" y1="120" x2="294" y2="120" stroke="#8b949e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ══ chant synth ══ -->
  <rect x="300" y="40" width="420" height="120" rx="10" fill="#10161f" stroke="#3fb950" stroke-width="2"/>
  <rect x="316" y="56" width="138" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.3"/>
  <text x="385" y="77" font-size="15" font-weight="700" fill="#3fb950" text-anchor="middle">chant synth</text>
  <rect x="464" y="56" width="86" height="30" rx="6" fill="#3fb950"/>
  <text x="507" y="77" font-size="11.5" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0.5">REQUIRED</text>
  <text x="510" y="115" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">chant build, into spec-native artifacts</text>
  <text x="510" y="140" font-size="12.5" fill="#8b949e" text-anchor="middle">deterministic · no network · no state · nothing running</text>

  <!-- ══ chant ops ══ -->
  <rect x="300" y="176" width="420" height="120" rx="10" fill="#10161f" stroke="#bc8cff" stroke-width="2"/>
  <rect x="316" y="192" width="122" height="30" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/>
  <text x="377" y="213" font-size="15" font-weight="700" fill="#bc8cff" text-anchor="middle">chant ops</text>
  <rect x="448" y="192" width="72" height="30" rx="6" fill="none" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="484" y="213" font-size="11.5" font-weight="700" fill="#bc8cff" text-anchor="middle" letter-spacing="0.5">OPT IN</text>
  <rect x="530" y="192" width="86" height="30" rx="6" fill="#bc8cff"/>
  <text x="573" y="213" font-size="11.5" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0.5">DURABLE</text>
  <text x="510" y="251" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">gates · rollback · apply</text>
  <text x="510" y="276" font-size="12.5" fill="#8b949e" text-anchor="middle">survives a crash · holds an approval for days</text>

  <!-- ══ chant lifecycle ══ -->
  <rect x="300" y="312" width="420" height="120" rx="10" fill="#10161f" stroke="#bc8cff" stroke-width="2"/>
  <rect x="316" y="328" width="158" height="30" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.3"/>
  <text x="395" y="349" font-size="15" font-weight="700" fill="#bc8cff" text-anchor="middle">chant lifecycle</text>
  <rect x="484" y="328" width="72" height="30" rx="6" fill="none" stroke="#bc8cff" stroke-width="1.2"/>
  <text x="520" y="349" font-size="11.5" font-weight="700" fill="#bc8cff" text-anchor="middle" letter-spacing="0.5">OPT IN</text>
  <rect x="566" y="328" width="80" height="30" rx="6" fill="#bc8cff"/>
  <text x="606" y="349" font-size="11.5" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0.5">GITOPS</text>
  <text x="510" y="387" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">observe · diff · plan · reconcile</text>
  <text x="510" y="412" font-size="12.5" fill="#8b949e" text-anchor="middle">reads live and opens a PR, or hand it to Argo</text>

  <line x1="720" y1="120" x2="744" y2="120" stroke="#8b949e" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- ══ DELIVERY ══ -->
  <rect x="750" y="40" width="260" height="392" rx="10" fill="none" stroke="#e0b84a" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.8"/>
  <rect x="766" y="54" width="228" height="30" rx="6" fill="#161b22" stroke="#e0b84a" stroke-width="1.3"/>
  <text x="880" y="75" font-size="13" font-weight="700" fill="#e0b84a" text-anchor="middle" letter-spacing="1">DELIVERY</text>

  <rect x="766" y="104" width="228" height="76" rx="8" fill="#161b22" stroke="#e0b84a" stroke-width="1.7"/>
  <text x="880" y="137" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">your platform,</text>
  <text x="880" y="160" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">unchanged</text>

  <rect x="766" y="200" width="110" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="821" y="223" font-size="12.5" fill="#c9d1d9" text-anchor="middle">kubectl · SSA</text>
  <rect x="884" y="200" width="110" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="939" y="223" font-size="12.5" fill="#c9d1d9" text-anchor="middle">Argo · Flux</text>
  <rect x="766" y="246" width="110" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="821" y="269" font-size="12.5" fill="#c9d1d9" text-anchor="middle">CFN deploy</text>
  <rect x="884" y="246" width="110" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="939" y="269" font-size="12.5" fill="#c9d1d9" text-anchor="middle">CI pipeline</text>

  <rect x="766" y="296" width="228" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="880" y="325" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">the platform reconciles</text>

  <text x="880" y="378" font-size="12.5" fill="#6e7681" text-anchor="middle" font-style="italic">nothing chant-specific in it</text>
  <text x="880" y="400" font-size="12.5" fill="#6e7681" text-anchor="middle" font-style="italic">walk away and it keeps working</text>

  <!-- ══ return path ══ -->
  <line x1="746" y1="372" x2="724" y2="372" stroke="#bc8cff" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arloop)"/>
  <line x1="296" y1="372" x2="274" y2="372" stroke="#bc8cff" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arloop)"/>
</svg>
