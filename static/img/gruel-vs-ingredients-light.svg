<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 452" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="452" fill="#ffffff"/>

