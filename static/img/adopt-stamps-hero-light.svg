<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="330" fill="#ffffff"/>

  <defs>
    <linearGradient id="cyl" x1="0" x2="1">
      <stop offset="0" stop-color="#8a929c"/>
      <stop offset="0.5" stop-color="#f3f6f9"/>
      <stop offset="1" stop-color="#8a929c"/>
    </linearGradient>

    <!-- A rubber stamp in side profile: knob, neck, mount, die. The die is
         the dark bar at the bottom - you cannot read a stamp's face edge-on,
         so the label rides on the mount. Its body deliberately avoids the
         theme palette: a physical object should not invert in light mode. -->
    <g id="stamp">
      <rect x="-42" y="-84" width="84" height="30" rx="15" fill="#2d333b" stroke="#586069" stroke-width="1.2"/>
      <rect x="-36" y="-80" width="72" height="9" rx="4.5" fill="#3d444d"/>
      <rect x="-13" y="-56" width="26" height="18" fill="#2b3138" stroke="#586069" stroke-width="1.2"/>
      <rect x="-52" y="-39" width="104" height="25" rx="3" fill="#22272e" stroke="#586069" stroke-width="1.2"/>
      <rect x="-56" y="-16" width="112" height="13" rx="2" fill="#101317" stroke="#484f58" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- the resource -->
  <path d="M108,170 L108,272 A62,17 0 0 0 232,272 L232,170 Z" fill="url(#cyl)"/>
  <ellipse cx="170" cy="170" rx="62" ry="17" fill="#b7bfc8"/>
  <path d="M108,204 A62,17 0 0 0 232,204" fill="none" stroke="#8a929c" stroke-width="1.4"/>
  <path d="M108,238 A62,17 0 0 0 232,238" fill="none" stroke="#8a929c" stroke-width="1.4"/>

  <!-- the markers it carries -->
  <path d="M246,194 l20,-20 h196 a7 7 0 0 1 7,7 v26 a7 7 0 0 1 -7,7 h-196 z" fill="#0969da"/>
  <circle cx="266" cy="194" r="5" fill="#ffffff"/>
  <text x="284" y="200" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tofu-estate</text>

  <path d="M246,246 l20,-20 h196 a7 7 0 0 1 7,7 v26 a7 7 0 0 1 -7,7 h-196 z" fill="#0969da"/>
  <circle cx="266" cy="246" r="5" fill="#ffffff"/>
  <text x="284" y="252" font-size="14" font-weight="700" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tofu-address</text>

  <!-- the two that write them -->
  <g transform="translate(292 150) rotate(-11) scale(1.15)">
    <use href="#stamp"/>
    <text x="0" y="-21" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">choudoufu</text>
  </g>

  <g transform="translate(444 150) rotate(11) scale(1.15)">
    <use href="#stamp"/>
    <text x="0" y="-21" font-size="12.5" font-weight="700" fill="#0550ae" text-anchor="middle">chant</text>
  </g>

  <text x="340" y="316" font-size="11.5" fill="#57606a" text-anchor="middle">ownership rides on the resource, not in a state file</text>
</svg>
