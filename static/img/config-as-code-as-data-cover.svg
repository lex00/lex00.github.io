<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <radialGradient id="cg" cx="0.5" cy="0.58" r="0.62">
    <stop offset="0" stop-color="#6c8cff" stop-opacity="0.15"/>
    <stop offset="0.75" stop-color="#6c8cff" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1280" height="720" fill="#0d1117"/>
<rect width="1280" height="720" fill="url(#cg)"/>

<text x="640" y="80" font-size="22" font-weight="700" letter-spacing="6" fill="#6e7681" text-anchor="middle">TYPESCRIPT AS DATA</text>

<text x="560" y="168" font-size="42" font-weight="800" fill="#e6edf3" text-anchor="end">Configuration as Code</text>
<path d="M585 154 H676" stroke="#6e7681" stroke-width="3" fill="none"/>
<path d="M674 147 L697 154 L674 161 Z" fill="#6e7681"/>
<text x="720" y="168" font-size="42" font-weight="800" fill="#a5b4fc" text-anchor="start">Configuration as Data</text>

<text x="640" y="216" font-size="23" fill="#8b949e" text-anchor="middle">The same thing at both ends, seen two ways.</text>

<rect x="90" y="270" width="460" height="310" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="114" y="308" font-size="18" font-weight="600" letter-spacing="1" fill="#8b949e">resource.ts</text>
<line x1="90" y1="324" x2="550" y2="324" stroke="#30363d" stroke-width="1.5"/>
<g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
  <text x="114" y="364"><tspan fill="#ff7b72">export const </tspan><tspan fill="#e6edf3">store </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#ff7b72">new </tspan><tspan fill="#d2a8ff">Bucket</tspan><tspan fill="#8b949e">({</tspan></text>
  <text x="140" y="395"><tspan fill="#79c0ff">BucketName</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"my-data"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text x="140" y="426"><tspan fill="#79c0ff">VersioningConfiguration</tspan><tspan fill="#8b949e">: {</tspan></text>
  <text x="166" y="457"><tspan fill="#79c0ff">Status</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Enabled"</tspan><tspan fill="#8b949e">,</tspan></text>
  <text x="140" y="488"><tspan fill="#8b949e">},</tspan></text>
  <text x="114" y="519"><tspan fill="#8b949e">});</tspan></text>
</g>

<rect x="730" y="270" width="460" height="310" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="754" y="308" font-size="18" font-weight="600" letter-spacing="1" fill="#8b949e">template.yaml</text>
<line x1="730" y1="324" x2="1190" y2="324" stroke="#30363d" stroke-width="1.5"/>
<g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
  <text x="754" y="364"><tspan fill="#79c0ff">store</tspan><tspan fill="#8b949e">:</tspan></text>
  <text x="780" y="395"><tspan fill="#79c0ff">Type</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">AWS::S3::Bucket</tspan></text>
  <text x="780" y="426"><tspan fill="#79c0ff">Properties</tspan><tspan fill="#8b949e">:</tspan></text>
  <text x="806" y="457"><tspan fill="#79c0ff">BucketName</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">my-data</tspan></text>
  <text x="806" y="488"><tspan fill="#79c0ff">VersioningConfiguration</tspan><tspan fill="#8b949e">:</tspan></text>
  <text x="832" y="519"><tspan fill="#79c0ff">Status</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">Enabled</tspan></text>
</g>

<text x="640" y="648" font-size="20" fill="#6e7681" text-anchor="middle">TypeScript is the right choice for infra</text>

<text x="1200" y="702" font-size="15" fill="#6e7681" text-anchor="end">lex00.github.io</text>
