<rect x="470" y="490" width="620" height="60" rx="8" fill="none" stroke="#f85149" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 7"/>
<text x="498" y="527" font-size="17" font-family="Menlo,Consolas,monospace" fill="#f85149" fill-opacity="0.75">nowhere</text>

</svg>
