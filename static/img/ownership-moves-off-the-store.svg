<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" style="max-width:660px;display:block;margin:0 auto" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="386" fill="#0d1117"/>

  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#8b949e"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ff7b72"/>
    </marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/>
    </marker>
  </defs>

  <text x="340" y="30" font-size="13" font-weight="700" fill="#7ee787" text-anchor="middle">the store was holding one fact</text>

  <!-- the store sits ON the path: everything routes through it, so it has to be current -->
  <rect x="40" y="46" width="600" height="120" rx="8" fill="#10161f" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="54" y="64" font-size="10.5" fill="#bc8cff">authoritative store</text>

  <path d="M549,100 Q444,64 344,92" fill="none" stroke="#ff7b72" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="452" y="62" font-size="9" fill="#ff7b72" text-anchor="middle">must stay correct and current</text>

  <rect x="64" y="100" width="130" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="129" y="120" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">your source</text>
  <text x="129" y="134" font-size="9" fill="#8b949e" text-anchor="middle">configuration</text>

  <rect x="244" y="92" width="190" height="60" rx="6" fill="#1a1230" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="339" y="114" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">state file · control plane</text>
  <text x="339" y="132" font-size="9" fill="#bc8cff" text-anchor="middle">config · attributes · OWNERSHIP</text>

  <rect x="484" y="100" width="130" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="549" y="126" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">the live system</text>

  <line x1="196" y1="122" x2="240" y2="122" stroke="#8b949e" stroke-width="1.3" marker-end="url(#an)"/>
  <line x1="436" y1="122" x2="480" y2="122" stroke="#8b949e" stroke-width="1.3" marker-end="url(#an)"/>

  <!-- ownership on the resource: nothing sits on the path, and the snapshot hangs off it -->
  <rect x="40" y="198" width="600" height="148" rx="8" fill="#10161f" stroke="#7ee787" stroke-width="1.5"/>
  <text x="54" y="216" font-size="10.5" fill="#7ee787">ownership on the resource</text>
  <text x="626" y="216" font-size="9.5" fill="#8b949e" text-anchor="end">nothing on the path</text>

  <rect x="64" y="238" width="130" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="129" y="258" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">your source</text>
  <text x="129" y="272" font-size="9" fill="#8b949e" text-anchor="middle">configuration</text>

  <rect x="244" y="238" width="130" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="309" y="258" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">the live system</text>
  <text x="309" y="272" font-size="9" fill="#8b949e" text-anchor="middle">attributes, on request</text>

  <rect x="424" y="230" width="190" height="60" rx="6" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
  <text x="519" y="252" font-size="11.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">each resource</text>
  <rect x="440" y="262" width="158" height="18" rx="4" fill="#0d1117" stroke="#7ee787"/>
  <text x="519" y="274" font-size="9" fill="#7ee787" text-anchor="middle">tofu-estate: servers</text>

  <line x1="196" y1="260" x2="240" y2="260" stroke="#7ee787" stroke-width="1.3" marker-end="url(#agr)"/>
  <line x1="376" y1="260" x2="420" y2="260" stroke="#7ee787" stroke-width="1.3" marker-end="url(#agr)"/>

  <line x1="309" y1="284" x2="309" y2="302" stroke="#30363d" stroke-width="1.3" stroke-dasharray="3 3"/>
  <rect x="244" y="302" width="130" height="28" rx="4" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
  <text x="309" y="320" font-size="9" fill="#8b949e" text-anchor="middle">snapshot · safe to delete</text>

  <text x="340" y="372" font-size="11.5" fill="#c9d1d9" text-anchor="middle">ownership was the only part with nowhere else to live</text>
</svg>
