# Project cards. Order is deliberate: choudoufu leads.
projects:
  - name: "choudoufu"
    tag: "Go · MPL-2.0"
    url: "https://intentius.io/choudoufu/"
    desc: "OpenTofu without the state file. Each resource carries its ownership as ordinary cloud tags, so AWS tells you what an estate contains and your existing IAM decides who may change it."

  - name: "chant"
    tag: "TypeScript"
    url: "https://intentius.io/chant"
    desc: "A synthesis compiler for infrastructure. Roundtrips native vendor specs 1:1 from a typed source, with an LSP and an MCP server on the same model."

  # One card, three repos. `parts` renders as linked chips inside the card.
  - name: "warden"
    tag: "Built on chant"
    desc: "Governance-as-code for git forges. One YAML file holds an org in a declared state: diff against the live API, run guardrails, dry-run or apply. Ownership-gated deletes and a removal cap so a typo cannot cascade. Three siblings on one shared reconcile core."
    parts:
      - label: "GitHub"
        url: "https://github.com/INTENTIUS/github-warden"
      - label: "GitLab"
        url: "https://github.com/INTENTIUS/gitlab-warden"
      - label: "Forgejo"
        url: "https://github.com/INTENTIUS/forgejo-warden"

  - name: "loomster"
    tag: "Built on chant"
    url: "https://intentius.io/loomster/"
    desc: "Typed, tiered infrastructure-as-code for awslabs/loom. Six components, three tiers, generated CI, and a naming scheme that keeps many instances from colliding."

  - name: "spicypath"
    tag: "Live"
    url: "https://spicypath.intentius.workers.dev"
    desc: "A profile inspector for the OpenTelemetry era. Reads OTLP Profiles, pprof, speedscope and four more formats into one model."

  - name: "blacklight"
    tag: "Hosted"
    url: "https://blacklight.intentius.io"
    desc: "Paste a repo URL, see the misconfigurations hiding in your infra. A hosted run of chant's audit engine."

  - name: "neo4j-backup"
    tag: "Dagster"
    url: "https://github.com/lex00/neo4j-backup"
    desc: "Policy-based backup and restore for self-hosted Neo4j Enterprise, as drop-in Dagster pipelines. Validated, and agentless on restore via seed-from-URI and an alias swap."

